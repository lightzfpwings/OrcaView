[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orcaview"
version = "0.1.0a61"
description = "A modular desktop pre/post-processing workbench for ORCA"
requires-python = ">=3.9"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
# Pin the GUI dependency for reproducible desktop builds.
gui = [
    "PySide6-Essentials==6.8.3",
    "openbabel==3.2.0; python_version >= '3.10'",
    "openbabel-wheel==3.1.1.23; python_version < '3.10'",
]

[project.scripts]
orcaview = "orcaview.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"orcaview.gui" = ["assets/orcaview.png", "assets/*.svg"]

