name: Refresh README figures

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: readme-gallery-main
  cancel-in-progress: false

jobs:
  gallery:
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install desktop dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-liberation libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0
          python -m pip install ".[gui]"
      - name: Capture the gallery
        run: python tools/render_readme_gallery.py
      - name: Publish changed figures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- ':(glob)artifacts/public/*.png'
          if git diff --cached --quiet; then
            echo "The published figures are current."
            exit 0
          fi
          if [[ "$(git rev-parse HEAD)" != "$(git ls-remote origin refs/heads/main | cut -f1)" ]]; then
            echo "A newer push will refresh the gallery."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh README figures from the current application'
          gh auth setup-git
          git push origin HEAD:main
