name: Verify release extensions

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to check
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            suffix: macOS-arm64.dmg
          - runner: windows-2022
            suffix: Windows-x64-portable.zip
          - runner: ubuntu-24.04
            suffix: Linux-x86_64.tar.gz
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0
      - name: Download the app and extension assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern "*$SUFFIX" --pattern 'OrcaView-Extensions-*.zip' --pattern 'SHA256UMS.txt' \
            --pattern '*-language-pack.zip' --pattern '*-color-pack.json' --pattern '*-extension-kit.zip' --pattern 'SHA256SUMS.txt'
      - name: Check the packaged application, extensions and exported media
        shell: bash
        run: python packaging/check_release_extensions.py assets "$RELEASE_TAG"
      - name: Get the interaction tests from the workflow revision for a manual recheck
        if: github.event_name == 'workflow_dispatch' && hashFiles('tests/test_design_targets.py') != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: validation
          persist-credentials: false
          sparse-checkout: tests/test_design_targets.py
          sparse-checkout-cone-mode: false
      - name: Load Windows system fonts for offscreen Qt tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fontDirectory = [Environment]::GetFolderPath('Fonts')
          if (-not (Test-Path -LiteralPath $fontDirectory -PathType Container)) {
            throw "Windows system font directory is unavailable"
          }
          "QT_QPA_FONTDIR=$fontDirectory" >> $env:GITHUB_ENV
      - name: Test 2D and 3D design interactions
        if: hashFiles('tests/test_design_targets.py') != ''
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          TEST_DIR: ${{ github.event_name == 'workflow_dispatch' && 'validation/tests' || 'tests' }}
        run: |
          python -m pip install ".[gui]"
          python -c "import os, orcaview; from PySide6.QtTest import QTest; assert orcaview.__version__ == os.environ['RELEASE_TAG'].removeprefix('v')"
          python -m unittest discover -s "$TEST_DIR" -p test_design_targets.py -v
      - name: Test fragment gestures, clipboard and hydrogen-bond optimization
        if: hashFiles('tests/test_hydrogen_bond_optimization.py') != ''
        shell: bash
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || 'offscreen' }}
        run: |
          python -m unittest discover -s tests -p "test_design_fragment*.py" -v
          python -m unittest discover -s tests -p test_hydrogen_bond_optimization.py -v
      - name: Test spectrum image export options
        if: hashFiles('src/orcaview/gui/spectrum_image_dialog.py') != ''
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p test_spectrum_plot.py -v
      - name: Test optimization curves and vibration camera controls
        if: hashFiles('tests/test_normal_mode_view_controls.py') != ''
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p test_optimization_curve.py -v
          python -m unittest discover -s tests -p test_normal_mode_view_controls.py -v
      - name: Test calculation sidebar layout and controls
        if: hashFiles('tests/test_inspector_width.py') != ''
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || 'offscreen' }}
        run: python -m unittest discover -s tests -p "test_inspector_*.py" -v
      - name: Test atomic population label placement
        if: hashFiles('tests/test_population_label_placement.py') != ''
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || 'offscreen' }}
        run: python -m unittest discover -s tests -p test_population_label_placement.py -v
      - name: Test protein and DNA backbone views and zoom
        if: hashFiles('tests/test_design_biopolymer_zoom.py') != ''
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -p 'test_*backbone*.py' -v
          python -m unittest discover -s tests -p test_design_biopolymer_zoom.py -v
          python -m unittest discover -s tests -p test_biopolymer_sequence.py -v
      - name: Test Molden and Cube orbitals, colors and surface quality controls
        if: hashFiles('tests/test_orbital_workspace.py') != ''
        shell: bash
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || 'offscreen' }}
        run: |
          python -m unittest discover -s tests -p 'test_*orbitals.py' -v
          python -m unittest discover -s tests -p test_orbital_workspace.py -v
